<!DOCTYPE html>
<html>
<head>
    <title>Rose Day</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .rose {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌹 Happy Rose Day Nityaa 🌹</h1>
        <p>
            Hilo hiloo pidduuu 😁😁  
            Yeh lo aapke liye sabse pyaari rose 🌹  
            Kyunki aap meri life ki sabse sundar phool ho ❤️
        </p>
        <button onclick="location.href='teddy.html'">Next Surprise ❤️</button>
    </div>

    <script>
        function createRose() {
            const rose = document.createElement("div");
            rose.classList.add("rose");
            rose.innerHTML = "🌹";
            rose.style.left = Math.random() * 100 + "vw";
            rose.style.animationDuration = (3 + Math.random() * 5) + "s";
            document.body.appendChild(rose);

            setTimeout(() => {
                rose.remove();
            }, 8000);
        }

        setInterval(createRose, 300);
    </script>

</body>
</html>
